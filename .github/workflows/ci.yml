name: CI - Security & Unit Tests

on:
  push:
    branches: [ "main", "release" ] # ✅ Afegit 'release'
  pull_request:
    branches: [ "main", "release" ] # ✅ Afegit 'release'

jobs:
  test:
    name: Run Vitest (Security & Logic)
    runs-on: ubuntu-latest
    
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://mock.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Tests
      run: pnpm test:ci